<template id="scene4-usecases-template">
  <div
    data-composition-id="scene4-usecases"
    data-width="1920"
    data-height="1080"
    data-duration="8"
  >
    <div class="canvas">
      <!-- Background -->
      <div class="bg-gradient"></div>

      <!-- Use case cards -->
      <div class="cards-container">
        <div class="card card-usc-1">
          <div class="card-icon">🤖</div>
          <div class="card-title">AI Devs</div>
          <div class="card-desc">Switch providers without editing .env</div>
          <div class="card-tags">
            <span class="tag">OpenAI</span>
            <span class="tag">Anthropic</span>
            <span class="tag">DeepSeek</span>
          </div>
        </div>

        <div class="card card-usc-2">
          <div class="card-icon">☁️</div>
          <div class="card-title">Cloud Engineers</div>
          <div class="card-desc">Staging, production, sandbox — one switch</div>
          <div class="card-tags">
            <span class="tag">Cloudflare</span>
            <span class="tag">Vercel</span>
            <span class="tag">Supabase</span>
          </div>
        </div>

        <div class="card card-usc-3">
          <div class="card-icon">💼</div>
          <div class="card-title">Freelancers</div>
          <div class="card-desc">Isolated client presets, zero cross-contamination</div>
          <div class="card-tags">
            <span class="tag">Client A</span>
            <span class="tag">Client B</span>
            <span class="tag">Client C</span>
          </div>
        </div>
      </div>
    </div>

    <style>
      [data-composition-id="scene4-usecases"] .canvas {
        width: 1920px;
        height: 1080px;
        background: #0a0a0f;
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="scene4-usecases"] .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at 50% 50%, rgba(124, 58, 237, 0.06) 0%, transparent 60%);
      }

      [data-composition-id="scene4-usecases"] .cards-container {
        display: flex;
        gap: 30px;
        z-index: 1;
      }

      [data-composition-id="scene4-usecases"] .card {
        width: 420px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 36px 32px;
        opacity: 0;
        transform: translateY(30px);
        backdrop-filter: blur(10px);
      }

      [data-composition-id="scene4-usecases"] .card-icon {
        font-size: 40px;
        margin-bottom: 20px;
      }

      [data-composition-id="scene4-usecases"] .card-title {
        font-size: 24px;
        font-weight: 700;
        color: white;
        margin-bottom: 10px;
      }

      [data-composition-id="scene4-usecases"] .card-desc {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1.5;
        margin-bottom: 20px;
      }

      [data-composition-id="scene4-usecases"] .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      [data-composition-id="scene4-usecases"] .tag {
        padding: 4px 12px;
        background: rgba(124, 58, 237, 0.1);
        border: 1px solid rgba(124, 58, 237, 0.2);
        border-radius: 100px;
        font-size: 12px;
        color: #a78bfa;
        font-weight: 500;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const cid = '[data-composition-id="scene4-usecases"]';
        const cards = [cid + ' .card-usc-1', cid + ' .card-usc-2', cid + ' .card-usc-3'];

        // Cards slide in from below with stagger
        cards.forEach((card, i) => {
          tl.to(card, {
            opacity: 1,
            y: 0,
            duration: 0.6,
            ease: "back.out(1.4)",
          }, 0.2 + i * 0.15);
        });

        // Hover-like effect on cards (sequential)
        tl.to(cards[0], { y: -6, borderColor: "rgba(124, 58, 237, 0.3)", duration: 0.3, ease: "power2.out" }, 1.5);
        tl.to(cards[0], { y: 0, borderColor: "rgba(255, 255, 255, 0.08)", duration: 0.3, ease: "power2.in" }, 1.8);
        tl.to(cards[1], { y: -6, borderColor: "rgba(124, 58, 237, 0.3)", duration: 0.3, ease: "power2.out" }, 2.1);
        tl.to(cards[1], { y: 0, borderColor: "rgba(255, 255, 255, 0.08)", duration: 0.3, ease: "power2.in" }, 2.4);
        tl.to(cards[2], { y: -6, borderColor: "rgba(124, 58, 237, 0.3)", duration: 0.3, ease: "power2.out" }, 2.7);
        tl.to(cards[2], { y: 0, borderColor: "rgba(255, 255, 255, 0.08)", duration: 0.3, ease: "power2.in" }, 3.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene4-usecases"] = tl;
      })();
    </script>
  </div>
</template>
