    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const cid = '[data-composition-id="scene3-how-it-works"]';
        const terminal = cid + ' .terminal-window';
        const desktopUI = cid + ' .desktop-ui';
        const termLines = [
          cid + ' .line-0', cid + ' .line-1', cid + ' .line-2',
          cid + ' .line-3', cid + ' .line-4', cid + ' .line-5'
        ];
        const secretItems = [
          cid + ' .ui-secret-item:nth-child(1)',
          cid + ' .ui-secret-item:nth-child(2)',
          cid + ' .ui-secret-item:nth-child(3)',
          cid + ' .ui-secret-item:nth-child(4)',
        ];
        const connLine = cid + ' .connection-line';

        // Both panels slide in
        tl.to(terminal, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.to(desktopUI, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);

        // Terminal lines type in
        termLines.forEach((line, i) => {
          tl.to(line, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.6 + i * 0.25);
        });

        // Connection line pulse
        tl.to(connLine, { opacity: 0.6, height: "200px", duration: 0.5, ease: "power2.out" }, 1.5);
        tl.to(connLine, { opacity: 0, duration: 0.3 }, 2.2);

        // Desktop UI secret items appear
        secretItems.forEach((item, i) => {
          tl.to(item, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.2)" }, 1.8 + i * 0.12);
        });

        // Subtle glow on active nav
        tl.to(cid + ' .ui-add-btn', { boxShadow: "0 0 20px rgba(124, 58, 237, 0.4)", duration: 0.4 }, 2.5);
        tl.to(cid + ' .ui-add-btn', { boxShadow: "0 0 0px rgba(124, 58, 237, 0)", duration: 0.4 }, 3.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene3-how-it-works"] = tl;
      })();
