# Build KeyDock for macOS and publish a GitHub Release with Tauri updater metadata.
# Triggered by pushing a tag like v0.2.0.
#
# Prerequisites:
#   1. Generate signing keypair:
#        cargo tauri signer generate -w .tauri/key -p <password> --ci -f
#   2. Set GitHub secrets matching the generated key:
#        gh secret set TAURI_PRIVATE_KEY < .tauri/key
#        gh secret set TAURI_KEY_PASSWORD <(echo -n "<password>")
#      The pubkey in src-tauri/tauri.conf.json must match .tauri/key.pub.
#   3. Push a tag:  git tag v0.6.2 && git push origin v0.6.2
#

name: Release
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Tauri's virtual universal target merges these two Rust targets.
          target: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/keydock-core
            crates/keydock-cli
          key: universal-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          bun run build
          bunx vitest run
          cargo test --workspace --exclude keydock-app -- --test-threads=1
          cargo check -p keydock-app

      - name: Build universal macOS bundles
        run: bun run tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          # Ad-hoc sign universal macOS builds so downloaded apps are not treated as damaged.
          # This is not Apple Developer ID signing/notarization; users may still need to allow the app in Privacy & Security.
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          # With --target, Tauri usually puts bundles under:
          #   target/<target>/release/bundle/
          # In Cargo workspaces the root target/ is used (not src-tauri/target/).
          for dir in \
            "target/universal-apple-darwin/release/bundle" \
            "target/release/bundle" \
            "src-tauri/target/universal-apple-darwin/release/bundle" \
            "src-tauri/target/release/bundle" \
            "target" \
            "src-tauri/target"; do
            if [ -d "$dir" ]; then
              DMG_FILE=$(find "$dir" -maxdepth 4 -name "*.dmg" -type f -print 2>/dev/null | head -1)
              UPDATER_FILE=$(find "$dir" -maxdepth 5 -name "*.app.tar.gz" -type f -print 2>/dev/null | head -1)
              if [ -n "$DMG_FILE" ] && [ -n "$UPDATER_FILE" ]; then
                echo "Found DMG: $DMG_FILE (in $dir)"
                echo "Found updater bundle: $UPDATER_FILE (in $dir)"
                break
              fi
            fi
          done

          if [ -z "$DMG_FILE" ] || [ -z "$UPDATER_FILE" ]; then
            echo "::error::No DMG or updater .app.tar.gz found under expected paths"
            echo "::group::Debug: bundle artifacts"
            find target src-tauri/target -maxdepth 8 \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -type f 2>/dev/null | sort || true
            echo "::endgroup::"
            exit 1
          fi

          UPDATER_SIG_FILE="${UPDATER_FILE}.sig"
          if [ ! -f "$UPDATER_SIG_FILE" ]; then
            echo "::error::Updater signature not found at $UPDATER_SIG_FILE"
            exit 1
          fi

          DMG_DIR="$(dirname "$DMG_FILE")"
          UPDATER_DIR="$(dirname "$UPDATER_FILE")"

          # Rename to predictable release asset names. The updater must use the
          # .app.tar.gz bundle on macOS; DMG is only for manual download.
          mv "$DMG_FILE" "$DMG_DIR/KeyDock-universal.dmg"
          mv "$UPDATER_FILE" "$UPDATER_DIR/KeyDock-universal.app.tar.gz"
          mv "$UPDATER_SIG_FILE" "$UPDATER_DIR/KeyDock-universal.app.tar.gz.sig"

          echo "DMG=$DMG_DIR/KeyDock-universal.dmg" >> "$GITHUB_OUTPUT"
          echo "UPDATER=$UPDATER_DIR/KeyDock-universal.app.tar.gz" >> "$GITHUB_OUTPUT"
          echo "UPDATER_SIG=$UPDATER_DIR/KeyDock-universal.app.tar.gz.sig" >> "$GITHUB_OUTPUT"

      - name: Generate update.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIG=$(cat "${{ steps.artifacts.outputs.UPDATER_SIG }}" 2>/dev/null || echo "")

          jq -n \
            --arg v "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$SIG" \
            --arg url "https://github.com/0xfig-labs/KeyDock/releases/download/${{ github.ref_name }}/KeyDock-universal.app.tar.gz" \
            '{
              version: $v,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $sig, url: $url },
                "darwin-x86_64": { signature: $sig, url: $url },
                "macos-universal": { signature: $sig, url: $url }
              }
            }' > update.json

          echo "update.json:"
          cat update.json

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.DMG }}
            ${{ steps.artifacts.outputs.UPDATER }}
            update.json
          generate_release_notes: true

      - name: Clean up old releases
        shell: bash
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | while read -r tag; do
              if [ "$tag" != "$CURRENT_TAG" ]; then
                echo "Deleting old release: $tag"
                gh release delete "$tag" --cleanup-tag=false --yes
              fi
            done
        env:
          GH_TOKEN: ${{ github.token }}
